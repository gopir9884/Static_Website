<!DOCTYPE html>
<html>
<head>
    <title>Button Example</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
        }

        button {
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 20px;
            font-size: 20px;
            color: #2563eb;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Website</h1>

    <button onclick="showMessage()">
        Click Me
    </button>

    <div id="message"></div>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "🎉 Thank you for clicking the button!";
        }
    </script>

</body>
</html>
